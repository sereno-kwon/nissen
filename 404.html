<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>NISSEN KOREA</title>
<meta name="robots" content="noindex">
<script>
  // 하위 주소(/sp31, /en/vintage ...)를 원페이지 섹션으로 연결
  // github.io 미리보기(/nissen/)와 자체 도메인(/) 모두 동작
  var base = location.hostname.slice(-10) === 'github.io' ? '/nissen/' : '/';
  var parts = location.pathname.slice(base.length).replace(/\/$/, '').toLowerCase().split('/');
  var lang = (parts[0] === 'en' || parts[0] === 'ja') ? parts.shift() + '/' : '';
  var key = parts.join('/');
  var alias = { 'inner':'sp31', 'inner-wire':'sp31', 'sp-31':'sp31', 'outer-cable':'outer', 'stainless':'outer', 'housing':'outer', 'french':'vintage', 'italian':'vintage', 'heritage':'vintage', 'ultralight':'vintage',
                'cable-guide':'guide', 'cables':'range', 'about':'brand', 'history':'story', 'contact':'showroom', 'dealer':'dealers', 'lineup':'range' };
  var map = { brand:1, range:1, sp31:1, outer:1, vintage:1, guide:1, story:1, showroom:1, dealers:1 };
  key = alias[key] || key;
  location.replace(base + lang + (map[key] ? '#' + key : ''));
</script>
<style>body{background:#fff}@media (prefers-color-scheme:dark){body{background:#101114}}</style>
</head>
<body></body>
</html>
